<footer class="footer">
    {{ with .Site.Params.footerHtml }}
        <span>{{ . | safeHTML }}</span>
    {{ else }}
        <span>
            © {{ now.Format "2006" }} {{ .Site.Params.author.name }}, {{ i18n "powered_by" }}
            <a href="https://gohugo.io" class="footerLink">Hugo</a> {{ i18n "and" }}
            <a href="https://github.com/A7med7x7/hugo-theme-nightfall-a7" class="footerLink">Nightfall A7</a> {{ i18n "theme" }}
        </span>
    {{ end }}
</footer>
