<footer class="footer">
    {{- if site.Params.footerHtml }}
        <span>{{ site.Params.footerHtml | safeHTML }}</span>
    {{- else if site.Copyright }}
        <span>{{ site.Copyright | markdownify }}</span>
    {{- else }}
        <span>
            © {{ now.Format "2006" }} {{ partial "site-name.html" . }}, {{ i18n "powered_by" }}
            <a href="https://gohugo.io" class="footerLink">Hugo</a> {{ i18n "and" }}
            <a href="https://github.com/A7med7x7/hugo-theme-afterword" class="footerLink">Afterword</a> {{ i18n "theme" }}
        </span>
    {{- end }}
</footer>
