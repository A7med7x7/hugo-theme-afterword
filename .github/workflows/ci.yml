name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build example site (Hugo ${{ matrix.hugo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ["0.128.0", "0.148.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: hugo-theme-nightfall-a7
      - name: Install Hugo
        run: |
          wget -qO "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_extended_${{ matrix.hugo }}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Build
        working-directory: hugo-theme-nightfall-a7/exampleSite
        run: hugo --gc --minify --themesDir ../..
      - name: Index search with Pagefind
        working-directory: hugo-theme-nightfall-a7/exampleSite
        run: npx -y pagefind --site public
      - name: Build a bare site with only a title
        run: |
          hugo new site bare
          cd bare
          printf 'baseURL = "https://example.org/"\ntitle = "Bare Site"\ntheme = "theme"\n' > hugo.toml
          ln -s "$GITHUB_WORKSPACE/hugo-theme-nightfall-a7" themes/theme
          mkdir -p content/posts
          printf -- '---\ntitle: First Post\ndate: 2026-01-01\n---\nHello.\n' > content/posts/first.md
          hugo
          # Header, home page, menu and footer must fall back to the title
          grep -q 'Bare Site' public/index.html
          grep -q 'First Post' public/index.html
          grep -q '~/posts' public/index.html
          ! grep -q '@ ~ \$' public/index.html
          ! grep -q '© [0-9]* ,' public/index.html
